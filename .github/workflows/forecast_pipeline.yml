name: 72-Hour AQI Forecast

on:
  workflow_dispatch:
  schedule:
    - cron: "5 * * * *"

jobs:
  generate-forecast:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-api.txt

      - name: Generate 72-hour forecast
        run: |
          python generate_72h_forecast.py

      - name: Commit updated forecast
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/forecast_72h.csv
          git diff --cached --quiet || git commit -m "Update 72-hour AQI forecast"
          git push
